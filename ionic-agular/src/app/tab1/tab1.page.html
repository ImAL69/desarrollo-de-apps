<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ionic Framework</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-intro">
    <p class="eyebrow">Componentes de interfaz</p>
    <h1>Explora Ionic</h1>
    <p>Una colección de componentes listos para crear aplicaciones modernas.</p>
  </div>

  <ion-list inset="true">
    <ion-item>
      <ion-icon slot="start" name="moon" color="primary"></ion-icon>
      <ion-label>
        <h2>Dark Mode</h2>
        <p>Cambia la apariencia de la aplicación</p>
      </ion-label>
      <ion-toggle slot="end" aria-label="Activar modo oscuro" [checked]="isDarkMode" (ionChange)="toggleDarkMode($event)"></ion-toggle>
    </ion-item>

    @for (item of components; track item.name) {
      <ion-item button detail="true">
        <ion-icon slot="start" [name]="item.icon" color="primary"></ion-icon>
        <ion-label>
          <h2>{{ item.name }}</h2>
          <p>{{ item.description }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
