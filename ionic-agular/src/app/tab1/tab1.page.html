<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ionic Framework</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-intro">
    <p class="eyebrow">Componentes de interfaz</p>
    <h1>Explora Ionic</h1>
    <p>Una colección de componentes listos para crear aplicaciones modernas.</p>
  </div>

  <ion-list inset="true">
    <ion-item>
      <ion-icon slot="start" name="moon" color="primary"></ion-icon>
      <ion-label>
        <h2>Modo oscuro</h2>
        <p>Activa o desactiva el tema oscuro</p>
      </ion-label>
      <ion-toggle slot="end" aria-label="Activar modo oscuro" [checked]="isDarkMode" (ionChange)="toggleDarkMode($event)"></ion-toggle>
    </ion-item>

    <ion-item button detail="true"><ion-icon slot="start" name="albums" color="primary"></ion-icon><ion-label>Accordion</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="list" color="primary"></ion-icon><ion-label>Action Sheet</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="alert-circle" color="primary"></ion-icon><ion-label>Alert</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="person" color="primary"></ion-icon><ion-label>Avatar</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="pricetag" color="primary"></ion-icon><ion-label>Badge</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="return-down-forward" color="primary"></ion-icon><ion-label>Breadcrumbs</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="play" color="primary"></ion-icon><ion-label>Button</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="card" color="primary"></ion-icon><ion-label>Card</ion-label></ion-item>
    <ion-item button detail="true"><ion-icon slot="start" name="checkbox" color="primary"></ion-icon><ion-label>Checkbox</ion-label></ion-item>
  </ion-list>
</ion-content>
